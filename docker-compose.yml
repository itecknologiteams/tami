services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tami
      POSTGRES_USER: tami
      POSTGRES_PASSWORD: tami
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tami-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tami -d tami"]
      interval: 5s
      timeout: 5s
      retries: 10

  nominatim:
    image: mediagis/nominatim:5.1
    environment:
      # Pakistan extract covers all Sindh launch cities.
      PBF_URL: https://download.geofabrik.de/asia/pakistan-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/asia/pakistan-updates/
      IMPORT_WIKIPEDIA: "false"
      NOMINATIM_PASSWORD: tami-nominatim
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - tami-nominatim-data:/var/lib/postgresql/16/main
      - tami-nominatim-flatnode:/nominatim/flatnode
    shm_size: 1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 120
      start_period: 30m

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6390:6379"
    volumes:
      - tami-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tami-postgres-data:
  tami-nominatim-data:
  tami-nominatim-flatnode:
  tami-redis-data:
