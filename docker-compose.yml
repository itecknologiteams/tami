services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tami
      POSTGRES_USER: tami
      POSTGRES_PASSWORD: tami
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - tami-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tami -d tami"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tami-postgres-data:
